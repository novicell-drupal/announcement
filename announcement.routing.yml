entity.announcement.collection:
  path: '/admin/content/announcement'
  defaults:
    _entity_list: 'announcement'
    _title: 'Announcements'
  requirements:
    _permission: 'access announcement overview'

entity.announcement.admin_form:
  path: '/admin/config/content/announcement/settings'
  defaults:
    _form: '\Drupal\announcement\Form\AnnouncementSettingsForm'
    _title: 'Announcement settings'
  requirements:
    _permission: 'administer announcement'

announcement.admin_create:
  path: '/admin/content/announcement/add'
  defaults:
    _entity_form: 'announcement.add'
    _title: 'Add announcement'
  requirements:
    _entity_create_access: 'announcement'
